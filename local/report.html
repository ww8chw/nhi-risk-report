<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>安安診所 · 健檢風險評估報告</title>
<style>
:root {
  /* 採用「安安診所健檢單」設計語彙 */
  --bg: #faf6ed;            /* 米白背景 */
  --paper: #ffffff;         /* 卡片白 */
  --paper-warm: #fdf8ec;    /* 暖白 */
  --ink: #2c3a33;           /* 主字色 — 深綠灰 */
  --ink-soft: #5a6b62;      /* 次要字 */
  --ink-faint: #95a39c;     /* 淺字 */
  --line: #e3dccb;          /* 米色細線 */
  --line-soft: #efe9d9;     /* 更淡的線 */
  --accent: #3a4540;        /* 深綠灰 — 主強調 */
  --accent-soft: #4d5b54;
  --gold: #b48a3c;          /* 暖金 — 強調 */

  /* 風險燈號（柔和版） */
  --green-bg: #e8f0e6;
  --green-text: #4a6b54;
  --green-line: #c8d9c2;
  --green-dot: #6f9778;

  --yellow-bg: #fbf1d9;
  --yellow-text: #8a6b1f;
  --yellow-line: #ecd9a8;
  --yellow-dot: #c9a04a;

  --red-bg: #f5e3df;
  --red-text: #8a3d34;
  --red-line: #e6c1b9;
  --red-dot: #b25446;

  --slate-bg: #ede7d6;
  --slate-line: #d8d0bc;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }

/* Top bar (編輯介面) */
header.top {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
}
header.top .inner {
  max-width: 960px; margin: 0 auto;
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand {
  display: flex; align-items: center; gap: 12px;
}
.brand .pill-logo {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px;
  background: var(--accent);
  color: var(--bg);
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 0.15em;
}
.brand .name { font-weight: 500; line-height: 1.2; font-size: 15px; }
.brand .sub { font-size: 11px; color: var(--ink-faint); line-height: 1.2; letter-spacing: 0.05em; }

/* Status pill */
.pill {
  font-size: 11px; padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid;
  letter-spacing: 0.05em;
  font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
}
.pill.ok { background: var(--green-bg); color: var(--green-text); border-color: var(--green-line); }
.pill.warn { background: var(--yellow-bg); color: var(--yellow-text); border-color: var(--yellow-line); }
.pill.err { background: var(--red-bg); color: var(--red-text); border-color: var(--red-line); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 4px;
  font-size: 13px; font-weight: 500;
  font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
  cursor: pointer;
  color: var(--ink);
  letter-spacing: 0.05em;
}
.btn:hover { background: var(--paper-warm); border-color: var(--ink-soft); }
.btn.primary {
  background: var(--accent); color: var(--bg); border-color: var(--accent);
}
.btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Form view */
.page-title {
  font-size: 22px; font-weight: 500; margin: 28px 0 6px;
  letter-spacing: 0.08em;
}
.lead { color: var(--ink-soft); margin-bottom: 24px; font-size: 13px; }

.section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 22px;
  margin-bottom: 16px;
}
.section h2 {
  font-size: 14px; margin: 0 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-soft);
  letter-spacing: 0.1em; font-weight: 500;
  color: var(--accent);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}
label.field { display: block; }
label.field .lbl {
  display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px;
  letter-spacing: 0.05em;
  font-family: "PingFang TC", sans-serif;
}
.input {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 14px; background: var(--paper-warm);
  font-family: "PingFang TC", sans-serif;
  color: var(--ink);
}
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--paper); }

/* Yes/No */
.yesno { display: flex; gap: 0; }
.yesno button {
  flex: 1;
  padding: 7px 0;
  border: 1px solid var(--line);
  background: var(--paper-warm);
  cursor: pointer;
  font-size: 13px;
  font-family: "PingFang TC", sans-serif;
  color: var(--ink-soft);
}
.yesno button:not(:last-child) { border-right: 0; }
.yesno button:first-child { border-radius: 4px 0 0 4px; }
.yesno button:last-child { border-radius: 0 4px 4px 0; }
.yesno button.active {
  background: var(--accent); color: var(--bg); border-color: var(--accent);
}

.actions {
  display: flex; gap: 10px; justify-content: flex-end;
  margin-top: 18px;
}

.error {
  padding: 12px 14px;
  background: var(--red-bg);
  border: 1px solid var(--red-line);
  border-radius: 4px;
  color: var(--red-text);
  font-size: 13px;
  margin-bottom: 16px;
  font-family: "PingFang TC", sans-serif;
}

.spinner {
  width: 14px; height: 14px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================ */
/* 報告版面 — 套用「健檢單」風格 / A5 橫向                        */
/* ============================================================ */
.report-shell {
  /* 螢幕預覽：A5 橫向比例 (210:148 ≈ 1.42) */
  max-width: 760px;
  margin: 24px auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 22px 28px;
  box-shadow: 0 4px 24px rgba(60,50,30,0.06);
}

.rh-pill {
  display: inline-flex; align-items: center;
  padding: 5px 16px;
  background: var(--accent);
  color: var(--bg);
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.3em;
  margin: 0 auto 8px;
}
.rh-title {
  text-align: center;
  font-size: 24px;
  letter-spacing: 0.5em;
  font-weight: 500;
  margin: 0 0 4px;
  padding-left: 0.5em;
  color: var(--ink);
}
.rh-sub {
  text-align: center;
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.2em;
  margin-bottom: 12px;
  font-family: "PingFang TC", sans-serif;
}
.rh-divider {
  width: 40px; height: 2px;
  background: var(--gold);
  margin: 0 auto 14px;
}

.rh-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 8px 16px;
  background: var(--paper-warm);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  margin-bottom: 14px;
  font-family: "PingFang TC", sans-serif;
}
.rh-meta > div { text-align: center; }
.rh-meta .l { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; margin-bottom: 2px; }
.rh-meta .v { font-size: 13px; color: var(--ink); }

.rh-section-title {
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--accent);
  margin: 0 0 10px;
  font-weight: 500;
}

/* 5 個疾病同大小，橫排 */
.risk-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}

.risk-card {
  padding: 10px 10px;
  border: 1px solid;
  border-radius: 4px;
  break-inside: avoid;
  font-family: "PingFang TC", sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 130px;
}
.risk-card.green { background: var(--green-bg); border-color: var(--green-line); }
.risk-card.yellow { background: var(--yellow-bg); border-color: var(--yellow-line); }
.risk-card.red { background: var(--red-bg); border-color: var(--red-line); }
.risk-card.unknown { background: var(--slate-bg); border-color: var(--slate-line); }

.rc-name {
  font-weight: 500;
  font-size: 13px;
  font-family: "Noto Serif TC", "Songti TC", serif;
  letter-spacing: 0.12em;
  color: var(--ink);
  text-align: center;
  margin-bottom: 4px;
}
.rc-level {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px;
  letter-spacing: 0.1em;
  font-weight: 500;
  align-self: center;
  margin-bottom: 6px;
}
.rc-level .dot { width: 6px; height: 6px; border-radius: 50%; }
.risk-card.green .rc-level { color: var(--green-text); }
.risk-card.green .dot { background: var(--green-dot); }
.risk-card.yellow .rc-level { color: var(--yellow-text); }
.risk-card.yellow .dot { background: var(--yellow-dot); }
.risk-card.red .rc-level { color: var(--red-text); }
.risk-card.red .dot { background: var(--red-dot); }

.rc-big {
  text-align: center;
  font-weight: 600;
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.02em;
  font-family: "Inter", "PingFang TC", sans-serif;
  margin-bottom: 6px;
}
.risk-card.green .rc-big { color: var(--green-text); }
.risk-card.yellow .rc-big { color: var(--yellow-text); }
.risk-card.red .rc-big { color: var(--red-text); }
.rc-pct { font-size: 14px; font-weight: 500; }

.rc-desc {
  font-size: 9.5px;
  color: var(--ink-soft);
  line-height: 1.4;
  text-align: center;
  margin-top: auto;
}

.unknown-text {
  font-size: 10px;
  color: var(--ink-soft);
  font-style: italic;
  text-align: center;
  margin: auto 0;
}

.report-footer {
  border-top: 1px solid var(--line-soft);
  padding-top: 8px;
  margin-top: 14px;
  text-align: center;
  font-family: "PingFang TC", sans-serif;
}
.report-footer .clinic {
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--accent);
  margin-bottom: 4px;
}
.report-footer .disclaimer {
  font-size: 9px;
  color: var(--ink-faint);
  line-height: 1.5;
  letter-spacing: 0.05em;
}

/* ============================================================ */
/* 列印 — A5 橫印 (210mm × 148mm)                                */
/* ============================================================ */
@page { size: A5 landscape; margin: 8mm; }

@media print {
  body { background: white !important; }
  .no-print { display: none !important; }
  .app { max-width: none; padding: 0; margin: 0; }
  .report-shell {
    max-width: none;
    margin: 0;
    border: none;
    box-shadow: none;
    padding: 0;
    border-radius: 0;
  }
  @page { size: A5 landscape; margin: 8mm; }

  /* A5 橫向收緊：總高約 132mm 可用 */
  .rh-pill { font-size: 9px; padding: 3px 12px; margin-bottom: 4px; }
  .rh-title { font-size: 18px; margin-bottom: 2px; }
  .rh-sub { font-size: 9px; margin-bottom: 6px; }
  .rh-divider { margin-bottom: 8px; height: 1.5px; }
  .rh-meta { padding: 6px 12px; margin-bottom: 8px; }
  .rh-meta .l { font-size: 8px; }
  .rh-meta .v { font-size: 11px; }
  .rh-section-title { font-size: 10px; margin-bottom: 6px; }

  .risk-card { padding: 7px 6px; min-height: 0; }
  .rc-name { font-size: 11px; margin-bottom: 3px; }
  .rc-level { font-size: 8px; margin-bottom: 4px; }
  .rc-big { font-size: 22px; margin-bottom: 4px; }
  .rc-pct { font-size: 11px; }
  .rc-desc { font-size: 8px; line-height: 1.3; }

  .report-footer { margin-top: 8px; padding-top: 6px; }
  .report-footer .clinic { font-size: 10px; margin-bottom: 2px; }
  .report-footer .disclaimer { font-size: 7.5px; }
}
</style>
</head>
<body>

<header class="top no-print">
  <div class="inner">
    <div class="brand">
      <span class="pill-logo">安 安 診 所</span>
      <div>
        <div class="name">健檢風險評估報告</div>
        <div class="sub">資料來源：國健署科學算病館</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="status-pill" class="pill warn">代理檢查中…</span>
      <button id="btn-back" class="btn" style="display:none;">← 回編輯</button>
      <span id="print-hint" style="display:none;font-size:11px;color:var(--ink-faint);letter-spacing:0.05em;font-family:'PingFang TC',sans-serif;">紙張請選 A5 · 橫向</span>
      <button id="btn-print" class="btn primary" style="display:none;" title="Chrome 列印對話框中：紙張大小選 A5，版面配置選橫向">列印 / 存 PDF</button>
    </div>
  </div>
</header>

<div class="app">

<!-- 編輯模式 -->
<div id="view-edit">
  <h1 class="page-title">健 檢 報 告 產 生 器</h1>
  <p class="lead">輸入病人健檢數值，本機代理自動透過國健署「科學算病館」計算 5 種慢性病 10 年風險。</p>

  <div class="section">
    <h2>病 人 資 料</h2>
    <div class="grid">
      <label class="field"><span class="lbl">姓名</span><input id="f-name" class="input" /></label>
      <label class="field"><span class="lbl">病歷號</span><input id="f-chartNo" class="input" /></label>
      <label class="field"><span class="lbl">性別 *</span>
        <select id="f-gender" class="input">
          <option value="">— 選擇 —</option>
          <option value="1">男</option>
          <option value="0">女</option>
        </select>
      </label>
      <label class="field"><span class="lbl">年齡 *</span><input id="f-age" type="number" min="20" max="100" class="input" /></label>
      <label class="field"><span class="lbl">報告日期</span><input id="f-reportDate" type="date" class="input" /></label>
    </div>
  </div>

  <div class="section">
    <h2>體 檢 數 值</h2>
    <div class="grid">
      <label class="field"><span class="lbl">收縮壓 SBP (mmHg)</span><input id="f-sbp" type="number" class="input" /></label>
      <label class="field"><span class="lbl">舒張壓 DBP (mmHg)</span><input id="f-dbp" type="number" class="input" /></label>
      <label class="field"><span class="lbl">總膽固醇 (mg/dL)</span><input id="f-chol" type="number" class="input" /></label>
      <label class="field"><span class="lbl">LDL (mg/dL)</span><input id="f-ldlc" type="number" class="input" /></label>
      <label class="field"><span class="lbl">HDL (mg/dL)</span><input id="f-hdlc" type="number" class="input" /></label>
      <label class="field"><span class="lbl">三酸甘油酯 TG (mg/dL)</span><input id="f-tg" type="number" class="input" /></label>
      <label class="field"><span class="lbl">空腹血糖 (mg/dL)</span><input id="f-glu" type="number" class="input" /></label>
      <label class="field"><span class="lbl">HbA1c (%)</span><input id="f-hba1c" type="number" step="0.1" class="input" /></label>
      <label class="field"><span class="lbl">身高 (cm)</span><input id="f-height" type="number" class="input" /></label>
      <label class="field"><span class="lbl">體重 (kg)</span><input id="f-weight" type="number" step="0.1" class="input" /></label>
      <label class="field"><span class="lbl">腰圍 (cm)</span><input id="f-waist" type="number" class="input" /></label>
    </div>
  </div>

  <div class="section">
    <h2>病 史</h2>
    <div class="grid">
      <div><span class="lbl" style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:0.05em;font-family:'PingFang TC',sans-serif;">高血壓</span>
        <div class="yesno" data-key="hbp">
          <button data-v="1">是</button><button data-v="0" class="active">否</button>
        </div>
      </div>
      <div><span class="lbl" style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:0.05em;font-family:'PingFang TC',sans-serif;">糖尿病</span>
        <div class="yesno" data-key="diabetes">
          <button data-v="1">是</button><button data-v="0" class="active">否</button>
        </div>
      </div>
      <div><span class="lbl" style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:0.05em;font-family:'PingFang TC',sans-serif;">抽菸</span>
        <div class="yesno" data-key="smoke">
          <button data-v="1">是</button><button data-v="0" class="active">否</button>
        </div>
      </div>
    </div>
  </div>

  <div id="error-box" class="error" style="display:none;"></div>

  <div class="actions">
    <button id="btn-clear" class="btn">清除</button>
    <button id="btn-submit" class="btn primary">產生報告</button>
  </div>
</div>

<!-- 報告模式 -->
<div id="view-report" style="display:none;">
  <article class="report-shell" id="report-content"></article>
</div>

</div>

<script>
const PROXY = 'http://localhost:7777';

const state = {
  form: {
    name: '', chartNo: '', gender: '', age: '', reportDate: new Date().toISOString().slice(0, 10),
    sbp: '', dbp: '', hdlc: '', ldlc: '', chol: '', tg: '', glu: '', hba1c: '',
    height: '', weight: '', waist: '',
    // 預設「否」（非未知）
    hbp: '0', diabetes: '0', smoke: '0',
  },
  results: null,
};

const DISEASES = ['chd', 'stroke', 'diabetes', 'hypertension', 'mace'];
const DISEASE_LABEL = {
  chd: '冠心病',
  stroke: '腦中風',
  diabetes: '糖尿病',
  hypertension: '高血壓',
  mace: '心血管不良事件',
};
const DISEASE_DESC = {
  chd: '未來 10 年發生冠狀動脈心臟病的機率',
  stroke: '未來 10 年發生腦中風的機率',
  diabetes: '未來 10 年罹患第二型糖尿病的機率',
  hypertension: '未來 10 年罹患高血壓的機率',
  mace: '綜合心血管事件 — 心肌梗塞 / 中風 / 死亡的 10 年機率',
};

// ---------- bind form inputs ----------
Object.keys(state.form).forEach((k) => {
  const el = document.getElementById('f-' + k);
  if (!el) return;
  el.value = state.form[k];
  el.addEventListener('input', (e) => { state.form[k] = e.target.value; });
});

// yesno groups
document.querySelectorAll('.yesno').forEach((grp) => {
  const key = grp.dataset.key;
  grp.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      grp.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      state.form[key] = btn.dataset.v;
    });
  });
});

// ---------- proxy health check ----------
async function checkProxy() {
  const pill = document.getElementById('status-pill');
  try {
    const r = await fetch(PROXY + '/api/healthz', { signal: AbortSignal.timeout(2000) });
    if (r.ok) {
      pill.textContent = '✓ 代理運作中';
      pill.className = 'pill ok';
      return true;
    }
  } catch (e) { /* fall through */ }
  pill.textContent = '⚠ 代理未啟動 — 請先雙擊「啟動.command」';
  pill.className = 'pill err';
  return false;
}
checkProxy();
setInterval(checkProxy, 8000);

// ---------- submit ----------
document.getElementById('btn-submit').addEventListener('click', async () => {
  const errBox = document.getElementById('error-box');
  errBox.style.display = 'none';

  const f = state.form;
  if (!f.gender || !f.age || Number(f.age) < 20) {
    errBox.textContent = '請填入性別和年齡 (20-100)';
    errBox.style.display = 'block';
    return;
  }

  const submitBtn = document.getElementById('btn-submit');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> 計算中…';

  const num = (s) => (s === '' ? undefined : Number(s));
  const flag = (s) => (s === '' ? undefined : Number(s));
  const payload = {
    gender: Number(f.gender), age: Number(f.age),
    sbp: num(f.sbp), dbp: num(f.dbp),
    hdlc: num(f.hdlc), ldlc: num(f.ldlc),
    chol: num(f.chol), tg: num(f.tg),
    glu: num(f.glu), hba1c: num(f.hba1c),
    height: num(f.height), weight: num(f.weight), waist: num(f.waist),
    hbp: flag(f.hbp), diabetes: flag(f.diabetes), smoke: flag(f.smoke),
  };
  const clean = Object.fromEntries(Object.entries(payload).filter(([, v]) => v !== undefined));

  try {
    const r = await fetch(PROXY + '/api/risk-assessment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(clean),
    });
    if (!r.ok) {
      const t = await r.text();
      throw new Error('伺服器錯誤 ' + r.status + '：' + t.slice(0, 200));
    }
    state.results = await r.json();
    renderReport();
    document.getElementById('view-edit').style.display = 'none';
    document.getElementById('view-report').style.display = 'block';
    document.getElementById('btn-back').style.display = 'inline-flex';
    document.getElementById('btn-print').style.display = 'inline-flex';
    document.getElementById('print-hint').style.display = 'inline';
    window.scrollTo(0, 0);
  } catch (e) {
    errBox.textContent = '無法連到本地代理或國健署。請確認「啟動.command」已雙擊執行。錯誤：' + (e.message || e);
    errBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '產生報告';
  }
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (confirm('確定清除所有欄位？')) location.reload();
});
document.getElementById('btn-back').addEventListener('click', () => {
  document.getElementById('view-report').style.display = 'none';
  document.getElementById('view-edit').style.display = 'block';
  document.getElementById('btn-back').style.display = 'none';
  document.getElementById('btn-print').style.display = 'none';
  document.getElementById('print-hint').style.display = 'none';
});
document.getElementById('btn-print').addEventListener('click', () => window.print());

// ---------- classify ----------
function classify(r) {
  if (r.multipleDiff >= 1.5) return { tone: 'red', label: '高 風 險' };
  if (r.multipleDiff >= 1.0) return { tone: 'yellow', label: '中 度 風 險' };
  return { tone: 'green', label: '低 於 平 均' };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- render report (5 個同大小 / 按風險降序 / 只留 risk%) ----------
function renderReport() {
  const f = state.form;
  const results = state.results;

  // 按風險高低降序排，無資料的擺最後
  const sorted = DISEASES.slice().sort((a, b) => {
    const ra = results[a], rb = results[b];
    const va = ra && 'risk' in ra ? ra.risk : -Infinity;
    const vb = rb && 'risk' in rb ? rb.risk : -Infinity;
    return vb - va;
  });

  function cardHtml(d) {
    const r = results[d];
    if (!r || !('risk' in r)) {
      return `
        <div class="risk-card unknown">
          <div class="rc-name">${DISEASE_LABEL[d]}</div>
          <div class="unknown-text">無法評估</div>
          <div class="rc-desc">${DISEASE_DESC[d]}</div>
        </div>`;
    }
    const lvl = classify(r);
    return `
      <div class="risk-card ${lvl.tone}">
        <div class="rc-name">${DISEASE_LABEL[d]}</div>
        <div class="rc-level"><span class="dot"></span>${lvl.label}</div>
        <div class="rc-big">${r.risk.toFixed(1)}<span class="rc-pct">%</span></div>
        <div class="rc-desc">${DISEASE_DESC[d]}</div>
      </div>`;
  }

  const cards = sorted.map(cardHtml).join('');

  const html = `
    <div style="text-align:center;">
      <span class="rh-pill">安 安 診 所 · 健 康 守 護</span>
    </div>
    <h1 class="rh-title">健 檢 風 險 評 估</h1>
    <div class="rh-sub">CHRONIC DISEASE RISK ASSESSMENT</div>
    <div class="rh-divider"></div>

    <div class="rh-meta">
      <div>
        <div class="l">姓 名</div>
        <div class="v">${escapeHtml(f.name || '—')}</div>
      </div>
      <div>
        <div class="l">性 別 / 年 齡</div>
        <div class="v">${f.gender === '1' ? '男' : f.gender === '0' ? '女' : '—'} / ${f.age ? escapeHtml(f.age) + ' 歲' : '—'}</div>
      </div>
      <div>
        <div class="l">報 告 日 期</div>
        <div class="v">${escapeHtml(f.reportDate)}</div>
      </div>
    </div>

    <div class="rh-section-title">10 年 慢 性 病 風 險 評 估</div>
    <div class="risk-grid">
      ${cards}
    </div>

    <div class="report-footer">
      <div class="clinic">安 安 診 所</div>
      <div class="disclaimer">
        資料來源：衛生福利部國民健康署「科學算病館」慢性疾病風險評估平台 v4<br>
        本評估僅供參考，不取代醫師臨床判斷與治療建議
      </div>
    </div>
  `;
  document.getElementById('report-content').innerHTML = html;
}

document.getElementById('f-reportDate').value = state.form.reportDate;
</script>
